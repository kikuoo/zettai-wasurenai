name: ZettaiWasurenai
options:
  bundleIdPrefix: com.zettaiwasurenai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEVELOPMENT_TEAM: PTD45769J5
    CODE_SIGN_STYLE: Automatic

targets:
  ZettaiWasurenai:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zettaiwasurenai.app
        DEVELOPMENT_TEAM: PTD45769J5
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ZettaiWasurenai.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ZettaiWidget

  ZettaiWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZettaiWidget
      - path: Models/ReminderItem.swift
      - path: Models/ReminderCategory.swift
      - path: Models/RepeatOption.swift
      - path: Models/LocationTarget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zettaiwasurenai.app.widget
        DEVELOPMENT_TEAM: PTD45769J5
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: ZettaiWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZettaiWidget/ZettaiWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
